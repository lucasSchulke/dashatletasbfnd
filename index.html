<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AtletasPro HTML</title>
    <style>
      :root {
        --bg: #f4f7f3;
        --panel: #ffffff;
        --panel-soft: #f8faf7;
        --line: #dbe6d9;
        --text: #183024;
        --muted: #6c8074;
        --brand: #20633d;
        --brand-soft: #e6f3ea;
        --danger: #b33a3a;
        --danger-soft: #fdeaea;
        --warning: #a36a08;
        --warning-soft: #fff2db;
        --success: #116149;
        --success-soft: #def4ea;
        --info: #2559a7;
        --info-soft: #eaf1fd;
        --shadow: 0 18px 40px rgba(24, 48, 36, 0.08);
        --radius: 18px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(32, 99, 61, 0.08), transparent 380px),
          radial-gradient(circle at top right, rgba(24, 48, 36, 0.06), transparent 320px),
          var(--bg);
      }

      body {
        display: flex;
        flex-direction: column;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      a {
        color: inherit;
      }

      .js-only {
        display: none !important;
      }

      .js-ready .js-only {
        display: inline-flex !important;
      }

      .layout {
        display: grid;
        grid-template-columns: 260px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        padding: 22px 16px;
        background: rgba(255, 255, 255, 0.88);
        border-right: 1px solid var(--line);
        backdrop-filter: blur(12px);
        position: sticky;
        top: 0;
        height: 100vh;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--brand-soft), #ffffff);
        border: 1px solid #dbe9de;
        margin-bottom: 18px;
      }

      .brand-mark {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: var(--brand);
        color: #fff;
        font-weight: 700;
      }

      .brand-title {
        font-size: 18px;
        font-weight: 700;
      }

      .brand-subtitle {
        color: var(--muted);
        font-size: 12px;
      }

      .nav {
        display: grid;
        gap: 8px;
      }

      .nav button {
        border: 0;
        background: transparent;
        color: var(--muted);
        border-radius: 14px;
        padding: 12px 14px;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .nav button:hover,
      .nav button.active {
        background: var(--brand-soft);
        color: var(--brand);
      }

      .sidebar-footer {
        margin-top: 18px;
        padding: 14px;
        border-radius: 16px;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
      }

      .main {
        padding: 28px;
      }

      .topbar {
        display: none;
      }

      .page-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      .page-title {
        margin: 0;
        font-size: 28px;
        line-height: 1.1;
      }

      .page-subtitle {
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
      }

      .card {
        background: var(--panel);
        border: 1px solid rgba(219, 230, 217, 0.9);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }

      .stat-card {
        padding: 18px;
      }

      .stat-label {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
      }

      .stat-value {
        font-size: 28px;
        font-weight: 700;
      }

      .columns-3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }

      .panel-body {
        padding: 14px 18px 18px;
      }

      .list {
        display: grid;
        gap: 12px;
      }

      .list-item {
        padding: 14px;
        border-radius: 14px;
        background: var(--panel-soft);
        border: 1px solid #edf3ec;
      }

      .list-item strong {
        display: block;
        margin-bottom: 4px;
      }

      .meta {
        color: var(--muted);
        font-size: 13px;
      }

      .muted {
        color: var(--muted);
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
      }

      .input,
      .select,
      .textarea {
        width: 100%;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 12px;
        padding: 11px 13px;
        color: var(--text);
        outline: none;
      }

      .textarea {
        min-height: 100px;
        resize: vertical;
      }

      .input:focus,
      .select:focus,
      .textarea:focus {
        border-color: #8fb49d;
        box-shadow: 0 0 0 4px rgba(32, 99, 61, 0.08);
      }

      .filter-field {
        min-width: 180px;
        flex: 1;
      }

      .btn {
        border: 0;
        border-radius: 12px;
        padding: 11px 15px;
        cursor: pointer;
        transition: 0.2s ease;
        font-weight: 600;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn-primary {
        background: var(--brand);
        color: #fff;
      }

      .btn-secondary {
        background: #fff;
        color: var(--text);
        border: 1px solid var(--line);
      }

      .btn-danger {
        background: var(--danger);
        color: #fff;
      }

      .btn-ghost {
        background: transparent;
        color: var(--muted);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 700;
      }

      .badge-ativo,
      .badge-entregue,
      .badge-concluido {
        background: var(--success-soft);
        color: var(--success);
      }

      .badge-prospect,
      .badge-enviado,
      .badge-aguardando_retorno {
        background: var(--info-soft);
        color: var(--info);
      }

      .badge-pausado,
      .badge-pendente,
      .badge-aguardando_postagem {
        background: var(--warning-soft);
        color: var(--warning);
      }

      .badge-encerrado,
      .badge-atrasado {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .status-select {
        width: auto;
        min-width: 132px;
        border-radius: 999px;
        border: 1px solid transparent;
        padding: 7px 28px 7px 11px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        background-repeat: no-repeat;
        background-size: 6px 6px, 6px 6px;
        background-position: calc(100% - 14px) calc(50% - 1px), calc(100% - 10px) calc(50% - 1px);
        background-image:
          linear-gradient(45deg, transparent 50%, currentColor 50%),
          linear-gradient(135deg, currentColor 50%, transparent 50%);
        appearance: none;
        -webkit-appearance: none;
        box-shadow: none;
      }

      .status-select.status-ativo,
      .status-select.status-entregue,
      .status-select.status-concluido {
        background-color: var(--success-soft);
        color: var(--success);
        border-color: #c8e7d8;
      }

      .status-select.status-prospect,
      .status-select.status-enviado,
      .status-select.status-aguardando_retorno {
        background-color: var(--info-soft);
        color: var(--info);
        border-color: #d1ddf6;
      }

      .status-select.status-pausado,
      .status-select.status-pendente,
      .status-select.status-aguardando_postagem {
        background-color: var(--warning-soft);
        color: var(--warning);
        border-color: #f1dfb6;
      }

      .status-select.status-encerrado,
      .status-select.status-atrasado {
        background-color: var(--danger-soft);
        color: var(--danger);
        border-color: #f0cccc;
      }

      .table-wrap {
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 900px;
      }

      th,
      td {
        text-align: left;
        padding: 14px 16px;
        border-bottom: 1px solid #eef3ee;
        vertical-align: top;
        font-size: 14px;
      }

      th {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: #f8faf7;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .action-link {
        background: transparent;
        border: 0;
        color: var(--brand);
        cursor: pointer;
        padding: 0;
        font-weight: 600;
      }

      .action-link.danger {
        color: var(--danger);
      }

      .empty {
        padding: 36px 20px;
        text-align: center;
        color: var(--muted);
      }

      .summary-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
      }

      .chip {
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: #fff;
      }

      .chip strong {
        display: block;
        margin-bottom: 4px;
      }

      .task-card {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 14px;
        padding: 16px;
        border-radius: 16px;
        border: 1px solid #ebf2ea;
        background: #fff;
      }

      .task-card.overdue {
        background: #fff7f7;
        border-color: #f0cccc;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 26, 20, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 1000;
      }

      .modal-backdrop.open {
        display: flex;
      }

      .modal {
        width: min(960px, 100%);
        max-height: calc(100vh - 48px);
        overflow: auto;
        background: #fff;
        border-radius: 24px;
        box-shadow: 0 28px 80px rgba(15, 26, 20, 0.22);
      }

      .modal.small {
        width: min(560px, 100%);
      }

      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(8px);
      }

      .modal-body {
        padding: 18px 20px 22px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .form-full {
        grid-column: 1 / -1;
      }

      .field label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 600;
      }

      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }

      .tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .tab {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--muted);
        border-radius: 999px;
        padding: 9px 12px;
        cursor: pointer;
      }

      .tab.active {
        background: var(--brand-soft);
        color: var(--brand);
        border-color: #cbe1d3;
      }

      .profile-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 16px;
      }

      .profile-metric {
        padding: 16px;
      }

      .details-grid {
        display: grid;
        grid-template-columns: 180px 1fr;
      }

      .details-grid > div {
        padding: 12px 0;
        border-bottom: 1px solid #eef3ee;
      }

      .details-grid .label {
        color: var(--muted);
      }

      .hidden {
        display: none;
      }

      @media (max-width: 1100px) {
        .stats-grid,
        .columns-3 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 860px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .sidebar {
          display: none;
        }

        .topbar {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          padding: 14px 18px;
          position: sticky;
          top: 0;
          z-index: 50;
          background: rgba(255, 255, 255, 0.94);
          border-bottom: 1px solid var(--line);
          backdrop-filter: blur(10px);
        }

        .topbar-nav {
          display: flex;
          gap: 8px;
          overflow: auto;
          padding: 0 18px 14px;
          background: rgba(255, 255, 255, 0.94);
          border-bottom: 1px solid var(--line);
          position: sticky;
          top: 58px;
          z-index: 49;
        }

      .topbar-nav button {
          white-space: nowrap;
          border: 1px solid var(--line);
          background: #fff;
          color: var(--muted);
          border-radius: 999px;
          padding: 10px 12px;
          cursor: pointer;
        }

        .topbar-nav button.active {
          background: var(--brand-soft);
          color: var(--brand);
          border-color: #cbe1d3;
        }

        .main {
          padding: 18px;
        }

        .page-head {
          flex-direction: column;
        }

        .stats-grid,
        .columns-3,
        .form-grid,
        .profile-grid,
        .details-grid {
          grid-template-columns: 1fr;
        }

        .task-card {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div>
        <strong>AtletasPro HTML</strong>
        <div class="muted" style="font-size: 12px;">MVP compartilhado via Supabase</div>
      </div>
      <button class="btn btn-secondary js-only" type="button" onclick="App.refreshFromServer(true)">Atualizar</button>
    </div>
    <div class="topbar-nav" id="topbarNav"></div>

    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">AP</div>
          <div>
            <div class="brand-title">AtletasPro</div>
            <div class="brand-subtitle">Dados compartilhados online</div>
          </div>
        </div>
        <nav class="nav" id="sidebarNav"></nav>
        <div class="sidebar-footer">
          Esta versao usa Supabase como banco compartilhado e atualiza automaticamente.
          <div style="margin-top: 12px;">
            <button class="btn btn-secondary js-only" type="button" onclick="App.refreshFromServer(true)">Atualizar</button>
          </div>
        </div>
      </aside>

      <main class="main">
      <div id="app">
          <div class="card empty">
            Conectando ao banco compartilhado...
            <div class="meta" style="margin-top: 10px;">Se esta pagina abrir vazia no mobile, use "Abrir no navegador" em vez do preview do Drive.</div>
          </div>
        </div>
      </main>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" onclick="App.maybeCloseModal(event)">
      <div class="modal" id="modal"></div>
    </div>

    <script>
      const STORAGE_KEY = "atletas_mvp_html_db_v1";
      const SUPABASE_URL = "https://qkphvlfurbnrlcoyuuim.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable__EwQwgsukP7F19sDJ0CVQQ__J3UamJC";
      const AUTO_REFRESH_MS = 10000;
      const ATTACHMENTS_BUCKET = "dashboard-anexos";
      const MAX_ATTACHMENT_SIZE = 6 * 1024 * 1024;

      const NAV_ITEMS = [
        { key: "dashboard", label: "Dashboard", icon: "📊" },
        { key: "atletas", label: "Atletas", icon: "🏃" },
        { key: "posts", label: "Posts", icon: "📱" },
        { key: "conversas", label: "Conversas", icon: "💬" },
        { key: "produtos", label: "Produtos", icon: "📦" },
        { key: "tarefas", label: "Tarefas", icon: "✅" }
      ];

      const STATUS_ATLETA = ["ativo", "prospect", "pausado", "encerrado"];
      const STATUS_PRODUTO = ["enviado", "entregue", "aguardando_postagem"];
      const STATUS_TAREFA = ["pendente", "aguardando_retorno", "concluido", "atrasado"];
      const PLATAFORMAS = ["instagram", "tiktok", "youtube"];
      const TIPOS_POST = ["story", "reel", "post", "tiktok", "youtube"];
      const CANAIS = ["whatsapp", "instagram", "email"];
      const MODALIDADES = ["Surf", "Skate", "Crossfit", "Corrida", "Fitness", "Futebol", "Basquete", "Natacao", "Ciclismo", "MMA", "Yoga", "Outro"];

      const App = {
        state: {
          view: "dashboard",
          modalOpen: false,
          profileTab: "dados",
          returnToProfile: null,
          syncing: false,
          filters: {
            atletas: { search: "", status: "", modalidade: "" },
            posts: { atletaId: "", plataforma: "", tipo: "" },
            conversas: { atletaId: "" },
            produtos: { status: "" },
            tarefas: { status: "" }
          }
        },

        async init() {
          try {
            document.body.className += `${document.body.className ? " " : ""}js-ready`;
            this.renderNav();
            this.renderLoading("Conectando ao banco compartilhado...");
            await this.refreshFromServer(false);
            this.startAutoRefresh();
          } catch (error) {
            const root = document.getElementById("app");
            root.innerHTML = `
              <div class="card empty">
                Nao foi possivel carregar o sistema.<br />
                Verifique se o SQL do Supabase foi executado e abra o arquivo direto no navegador.
              </div>
            `;
            console.error(error);
          }
        },

        renderLoading(message) {
          const root = document.getElementById("app");
          root.innerHTML = `
            <div class="card empty">
              ${this.escape(message || "Carregando...")}
            </div>
          `;
        },

        startAutoRefresh() {
          if (this.autoRefreshTimer) {
            clearInterval(this.autoRefreshTimer);
          }

          this.autoRefreshTimer = window.setInterval(() => {
            this.refreshFromServer(false, true);
          }, AUTO_REFRESH_MS);
        },

        supabaseHeaders(prefer) {
          const headers = {
            apikey: SUPABASE_ANON_KEY
          };

          if (prefer) {
            headers.Prefer = prefer;
          }

          return headers;
        },

        async supabaseRequest(path, options) {
          const config = options || {};
          const method = config.method || "GET";
          const headers = this.supabaseHeaders(config.prefer);

          if (method !== "GET" && method !== "DELETE") {
            headers["Content-Type"] = "application/json";
          }

          const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
            method,
            headers,
            body: config.body ? JSON.stringify(config.body) : undefined
          });

          const text = await response.text();

          if (!response.ok) {
            let message = "Nao foi possivel falar com o banco compartilhado.";
            try {
              const payload = text ? JSON.parse(text) : null;
              if (payload && (payload.message || payload.error_description || payload.hint || payload.details)) {
                message = payload.message || payload.error_description || payload.hint || payload.details;
              }
            } catch (error) {
              if (text) {
                message = text;
              }
            }
            if (!config.silent) {
              alert(message);
            }
            throw new Error(text || `Erro ${response.status}`);
          }

          return text ? JSON.parse(text) : null;
        },

        emptyToNull(value) {
          if (value == null) return null;
          const normalized = String(value).trim();
          return normalized ? normalized : null;
        },

        numberOrNull(value) {
          if (value == null || value === "") return null;
          const numberValue = Number(value);
          return Number.isNaN(numberValue) ? null : numberValue;
        },

        getStorage() {
          try {
            return window.localStorage;
          } catch (error) {
            return null;
          }
        },

        nowIso() {
          return new Date().toISOString();
        },

        today() {
          return new Date().toISOString().slice(0, 10);
        },

        async loadDb() {
          const result = await Promise.all([
            this.supabaseRequest("athletes?select=*"),
            this.supabaseRequest("posts?select=*"),
            this.supabaseRequest("conversations?select=*"),
            this.supabaseRequest("products?select=*"),
            this.supabaseRequest("tasks?select=*"),
            this.supabaseRequest("couponSales?select=*"),
            this.supabaseRequest("attachments?select=*", { silent: true }).catch(() => [])
          ]);

          return this.normalizeDb({
            meta: {},
            athletes: result[0] || [],
            posts: result[1] || [],
            conversations: result[2] || [],
            products: result[3] || [],
            tasks: result[4] || [],
            couponSales: result[5] || [],
            attachments: result[6] || []
          });
        },

        saveDb() {
          return null;
        },

        normalizeDb(db) {
          db.couponSales = db.couponSales || [];
          db.attachments = db.attachments || [];
          db.meta = db.meta || {};
          db.meta.couponSales = db.meta.couponSales || (
            db.couponSales.reduce((max, item) => Math.max(max, Number(item.id) || 0), 0) + 1
          );
          db.tasks = (db.tasks || []).map((item) => {
            item.status = item.status === "entregue" ? "concluido" : item.status;
            return item;
          });

          return db;
        },

        resetSeed() {
          alert("Na versao online, o seed inicial e feito pelo SQL do Supabase. Use Atualizar para recarregar os dados compartilhados.");
        },

        async refreshFromServer(showLoading, silent) {
          if (this.state.syncing) return;
          if (silent && this.state.modalOpen) return;

          this.state.syncing = true;

        renderNav() {
          const navHtml = NAV_ITEMS.map((item) => `
            <button type="button" class="${this.state.view === item.key ? "active" : ""}" onclick="App.setView('${item.key}')">
              <span>${item.icon}</span>
              <span>${item.label}</span>
            </button>
          `).join("");

          document.getElementById("sidebarNav").innerHTML = navHtml;
          document.getElementById("topbarNav").innerHTML = navHtml;
        },

        setView(view) {
          this.state.view = view;
          this.renderNav();
          this.render();
        },

        render() {
          const root = document.getElementById("app");
          if (this.state.view === "dashboard") root.innerHTML = this.renderDashboard();
          if (this.state.view === "atletas") root.innerHTML = this.renderAthletes();
          if (this.state.view === "posts") root.innerHTML = this.renderPosts();
          if (this.state.view === "conversas") root.innerHTML = this.renderConversations();
          if (this.state.view === "produtos") root.innerHTML = this.renderProducts();
          if (this.state.view === "tarefas") root.innerHTML = this.renderTasks();
        },

        athleteById(id) {
          return this.db.athletes.find((item) => Number(item.id) === Number(id));
        },

        athleteNameById(id) {
          const athlete = this.athleteById(id);
          return athlete && athlete.nome ? athlete.nome : "-";
        },

        escape(value) {
          const map = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;"
          };
          return String(value == null ? "" : value).replace(/[&<>"]/g, (char) => map[char] || char);
        },

        formatDate(value) {
          if (!value) return "-";
          const [year, month, day] = String(value).split("-");
          if (!year || !month || !day) return value;
          return `${day}/${month}/${year}`;
        },

        formatCurrency(value) {
          return Number(value || 0).toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
          });
        },

        formatNumber(value) {
          const num = Number(value || 0);
          if (num >= 1000000) return `${(num / 1000000).toFixed(1)}M`;
          if (num >= 1000) return `${(num / 1000).toFixed(1)}K`;
          return String(num);
        },

        countPostsByAthlete(athleteId) {
          return this.db.posts.filter((item) => Number(item.atletaId) === Number(athleteId)).length;
        },

        totalProductCostByAthlete(athleteId) {
          return this.db.products
            .filter((item) => Number(item.atletaId) === Number(athleteId))
            .reduce((sum, item) => sum + Number(item.custoTotal || 0), 0);
        },

        couponSalesByAthlete(athleteId) {
          return this.db.couponSales
            .filter((item) => Number(item.atletaId) === Number(athleteId))
            .sort((a, b) => String(b.dataVenda || "").localeCompare(String(a.dataVenda || "")));
        },

        totalCouponSalesByAthlete(athleteId) {
          return this.couponSalesByAthlete(athleteId)
            .reduce((sum, item) => sum + Number(item.valorTotal || 0), 0);
        },

        totalCouponOrdersByAthlete(athleteId) {
          return this.couponSalesByAthlete(athleteId)
            .reduce((sum, item) => sum + Number(item.quantidadePedidos || 0), 0);
        },

        estimatedCommissionByAthlete(athleteId) {
          const athlete = this.athleteById(athleteId);
          const commission = Number(athlete && athlete.comissaoPercentual ? athlete.comissaoPercentual : 0);
          return this.totalCouponSalesByAthlete(athleteId) * (commission / 100);
        },

        athleteProfileTrigger(athleteId, label) {
          if (!athleteId) return this.escape(label || "-");
          return `<button class="action-link" type="button" onclick="App.openAthleteProfile(${Number(athleteId)})">${this.escape(label || "-")}</button>`;
        },

        computedTaskStatus(task) {
          if (task.status === "concluido" || task.status === "entregue") return "concluido";
          if (task.status === "aguardando_retorno") {
            if (task.prazo && task.prazo < this.today()) return "atrasado";
            return "aguardando_retorno";
          }
          if (task.status === "atrasado") return "atrasado";
          if (task.prazo && task.prazo < this.today()) return "atrasado";
          return "pendente";
        },

        statusList(kind) {
          if (kind === "athlete") return STATUS_ATLETA;
          if (kind === "product") return STATUS_PRODUTO;
          if (kind === "task") return STATUS_TAREFA;
          return [];
        },

        statusLabel(status) {
          return this.escape(String(status || "").split("_").join(" "));
        },

        statusControl(kind, id, currentStatus, athleteId, tab) {
          const list = this.statusList(kind);
          const status = currentStatus || "";
          const contextArgs = athleteId ? `, ${Number(athleteId)}, '${tab || "dados"}'` : "";
          return `
            <select class="status-select status-${status}" onchange="App.changeStatus('${kind}', ${Number(id)}, this.value${contextArgs})">
              ${list.map((item) => `<option value="${item}" ${item === status ? "selected" : ""}>${this.statusLabel(item)}</option>`).join("")}
            </select>
          `;
        },

        badge(status) {
          return `<span class="badge badge-${status}">${this.escape(String(status || "").split("_").join(" "))}</span>`;
        },

        async saveRecord(collection, record, id) {
          const payload = { ...record };
          delete payload.id;

          if (id) {
            const rows = await this.supabaseRequest(`${collection}?id=eq.${encodeURIComponent(id)}`, {
              method: "PATCH",
              prefer: "return=representation",
              body: payload
            });
            return rows && rows[0] ? rows[0] : null;
          }

          const rows = await this.supabaseRequest(collection, {
            method: "POST",
            prefer: "return=representation",
            body: [payload]
          });
          return rows && rows[0] ? rows[0] : null;
        },

        async deleteRecord(collection, id) {
          await this.supabaseRequest(`${collection}?id=eq.${encodeURIComponent(id)}`, {
            method: "DELETE"
          });
        },

        async deleteWhere(collection, filters) {
          const query = Object.keys(filters)
            .map((key) => `${encodeURIComponent(key)}=eq.${encodeURIComponent(filters[key])}`)
            .join("&");

          await this.supabaseRequest(`${collection}?${query}`, {
            method: "DELETE"
          });
        },

        nextId(collectionKey) {
          const next = this.db.meta[collectionKey];
          this.db.meta[collectionKey] += 1;
          return next;
        },

        addDays(dateValue, days) {
          const base = dateValue ? new Date(`${dateValue}T12:00:00`) : new Date();
          base.setDate(base.getDate() + days);
          return base.toISOString().slice(0, 10);
        },

        setReturnToProfile(athleteId, tab) {
          this.state.returnToProfile = athleteId ? {
            athleteId: Number(athleteId),
            tab: tab || "dados"
          } : null;
        },

        async afterEntitySave() {
          const context = this.state.returnToProfile;
          this.state.returnToProfile = null;
          await this.refreshFromServer(false);

          if (context) {
            this.openAthleteProfile(context.athleteId, context.tab);
            return;
          }

          this.closeModal();
          this.render();
        },

        cancelModalFlow() {
          const context = this.state.returnToProfile;
          this.state.returnToProfile = null;
          this.closeModal();
          if (context) {
            this.openAthleteProfile(context.athleteId, context.tab);
          }
        },

        async createAutoTask({ atletaId, tarefa, campanha, prazo, origemTipo, origemId, origemAcao }) {
          if (!tarefa) return null;

          const exists = this.db.tasks.find((item) =>
            item.origemTipo === origemTipo &&
            Number(item.origemId) === Number(origemId) &&
            item.origemAcao === origemAcao
          );

          if (exists) return exists;

          const record = {
            atletaId: Number(atletaId),
            tarefa: String(tarefa).trim(),
            campanha: String(campanha || "").trim(),
            prazo: prazo || this.addDays(this.today(), 3),
            status: "pendente",
            origemTipo,
            origemId: Number(origemId),
            origemAcao,
            createdAt: this.nowIso(),
            updatedAt: this.nowIso()
          };

          try {
            return await this.saveRecord("tasks", record, null);
          } catch (error) {
            return null;
          }
        },

        async maybeCreateProductTasks(record, previousStatus, isNewRecord) {
          if (record.status === "entregue" && previousStatus !== "entregue") {
            await this.createAutoTask({
              atletaId: record.atletaId,
              tarefa: `Confirmar postagem apos recebimento do produto ${record.produto}`,
              campanha: "",
              prazo: this.addDays(this.today(), 5),
              origemTipo: "produto",
              origemId: record.id,
              origemAcao: "aguardar_postagem"
            });
          }
        },

        async changeStatus(kind, id, value, athleteId, tab) {
          this.setReturnToProfile(athleteId, tab);

          if (kind === "athlete") {
            const record = this.db.athletes.find((item) => Number(item.id) === Number(id));
            if (!record) return;
            record.status = value;
            record.updatedAt = this.nowIso();
            await this.saveRecord("athletes", record, record.id);
          }

          if (kind === "product") {
            const record = this.db.products.find((item) => Number(item.id) === Number(id));
            if (!record) return;
            const previousStatus = record.status;
            record.status = value;
            record.updatedAt = this.nowIso();
            await this.saveRecord("products", record, record.id);
            await this.maybeCreateProductTasks(record, previousStatus, false);
          }

          if (kind === "task") {
            const record = this.db.tasks.find((item) => Number(item.id) === Number(id));
            if (!record) return;
            record.status = value;
            record.updatedAt = this.nowIso();
            await this.saveRecord("tasks", record, record.id);
          }

          await this.afterEntitySave();
        },

        openModal(title, bodyHtml, small) {
          const modal = document.getElementById("modal");

        async deleteAthlete(id) {
          const athlete = this.athleteById(id);
          if (!athlete) return;
          if (!confirm(`Excluir ${athlete.nome} e todos os registros vinculados?`)) return;

          const attachments = this.attachmentsByAthlete(id);
          for (const attachment of attachments) {
            await this.deleteStorageObject(attachment.caminhoArquivo).catch(() => null);
          }
          await this.deleteWhere("attachments", { atletaId: Number(id) }).catch(() => null);
          await this.deleteRecord("athletes", id);
          await this.afterEntitySave();
        },

        async deleteEntity(collection, id, athleteId, tab) {
          const names = {
            posts: "post",
            conversations: "conversa",
            products: "produto",
            tasks: "tarefa",
            couponSales: "venda",
            attachments: "anexo"
          };
          if (!confirm(`Excluir ${names[collection] || "registro"}?`)) return;
          this.setReturnToProfile(athleteId, tab);
          await this.deleteRecord(collection, id);

          if (collection === "conversations") {
            await this.deleteWhere("tasks", {
              origemTipo: "conversa",
              origemId: Number(id)
            });
          }

          if (collection === "products") {
            await this.deleteWhere("tasks", {
              origemTipo: "produto",
              origemId: Number(id)
            });
          }

          await this.afterEntitySave();
        },

        attachmentsByAthlete(athleteId) {
          return (this.db.attachments || [])
            .filter((item) => Number(item.atletaId) === Number(athleteId))
            .sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
        },

        storagePath(path) {
          return String(path || "").split("/").map((part) => encodeURIComponent(part)).join("/");
        },

        sanitizeFileName(name) {
          return String(name || "arquivo")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-zA-Z0-9._-]+/g, "-")
            .replace(/^-+|-+$/g, "") || "arquivo";
        },

        formatFileSize(bytes) {
          const value = Number(bytes) || 0;
          if (value < 1024) return `${value} B`;
          if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KB`;
          return `${(value / (1024 * 1024)).toFixed(1)} MB`;
        },

        storagePublicUrl(path) {
          return `${SUPABASE_URL}/storage/v1/object/public/${ATTACHMENTS_BUCKET}/${this.storagePath(path)}`;
        },

        async uploadStorageObject(path, file) {
          const response = await fetch(`${SUPABASE_URL}/storage/v1/object/${ATTACHMENTS_BUCKET}/${this.storagePath(path)}`, {
            method: "POST",
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              "Content-Type": file.type || "application/octet-stream",
              "x-upsert": "false"
            },
            body: file
          });

          if (!response.ok) {
            const text = await response.text();
            throw new Error(text || "Nao foi possivel enviar o arquivo.");
          }
        },

        async deleteStorageObject(path) {
          if (!path) return;
          const response = await fetch(`${SUPABASE_URL}/storage/v1/object/${ATTACHMENTS_BUCKET}/${this.storagePath(path)}`, {
            method: "DELETE",
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`
            }
          });

          if (!response.ok) {
            const text = await response.text();
            throw new Error(text || "Nao foi possivel excluir o arquivo.");
          }
        },

        async deleteAttachment(id, athleteId) {
          const attachment = (this.db.attachments || []).find((item) => Number(item.id) === Number(id));
          if (!attachment) return;
          if (!confirm(`Excluir o anexo ${attachment.nomeArquivo}?`)) return;

          this.setReturnToProfile(athleteId, "anexos");
          try {
            await this.deleteStorageObject(attachment.caminhoArquivo);
            await this.deleteRecord("attachments", id);
            await this.afterEntitySave();
          } catch (error) {

        async submitProduct(event, id) {
          event.preventDefault();
          const fd = new FormData(event.target);
          const existing = id ? this.db.products.find((item) => Number(item.id) === Number(id)) : null;

          if (!existing) {
            const atletaId = Number(fd.get("atletaId"));
            const dataEnvio = this.emptyToNull(fd.get("dataEnvio"));
            const status = String(fd.get("status") || "enviado");
            const items = event.target.querySelectorAll("[data-product-item]");

            if (!atletaId) {
              alert("Selecione um atleta antes de salvar o envio.");
              return;
            }

            for (let index = 0; index < items.length; index += 1) {
              const row = items[index];
              const produto = String((row.querySelector('[name="produto"]') || {}).value || "").trim();
              const tamanho = String((row.querySelector('[name="tamanho"]') || {}).value || "").trim();
              const quantidade = Number((row.querySelector('[name="quantidade"]') || {}).value || 1) || 1;
              const valorProduto = Number((row.querySelector('[name="valorProduto"]') || {}).value || 0) || 0;

              if (!produto) {
                alert("Preencha o nome de todos os produtos antes de salvar.");
                return;
              }

              const record = {
                atletaId,
                produto,
                tamanho,
                quantidade,
                dataEnvio,
                valorProduto,
                custoTotal: quantidade * valorProduto,
                status,
                createdAt: this.nowIso(),
                updatedAt: this.nowIso()
              };

              const savedRecord = await this.saveRecord("products", record, null);
              await this.maybeCreateProductTasks(savedRecord || record, "", true);
            }

            await this.afterEntitySave();
            return;
          }

          const previousStatus = existing && existing.status ? existing.status : "";
          const quantidade = Number(fd.get("quantidade") || 1) || 1;
          const valorProduto = Number(fd.get("valorProduto") || 0) || 0;
          const record = {
            atletaId: Number(fd.get("atletaId")),
            produto: String(fd.get("produto") || "").trim(),
            tamanho: String(fd.get("tamanho") || "").trim(),
            quantidade,
            dataEnvio: this.emptyToNull(fd.get("dataEnvio")),
            valorProduto,
            custoTotal: quantidade * valorProduto,
            status: String(fd.get("status") || "enviado"),
            createdAt: existing ? existing.createdAt : this.nowIso(),
            updatedAt: this.nowIso()
          };

          const savedRecord = await this.saveRecord("products", record, existing ? existing.id : null);
          await this.maybeCreateProductTasks(savedRecord || record, previousStatus, !existing);
          await this.afterEntitySave();
        },

                  ${this.field("Data da venda *", `<input class="input" type="date" name="dataVenda" required value="${this.escape(recordData.dataVenda || this.today())}" />`)}
                  ${this.field("Valor total *", `<input class="input" type="number" step="0.01" name="valorTotal" required value="${this.escape(recordData.valorTotal || "")}" />`)}
                  ${this.field("Quantidade de pedidos", `<input class="input" type="number" min="0" name="quantidadePedidos" value="${this.escape(recordData.quantidadePedidos || "")}" />`)}
                  ${this.field("Observacao", `<textarea class="textarea" name="observacao">${this.escape(recordData.observacao || "")}</textarea>`, true)}
                </div>
                <div class="form-actions">
                  <button class="btn btn-secondary" type="button" onclick="App.cancelModalFlow()">Cancelar</button>
                  <button class="btn btn-primary" type="submit">Salvar</button>
                </div>
              </form>
            `
          );
        },

        async submitCouponSale(event, id) {
          event.preventDefault();
          const fd = new FormData(event.target);
          const existing = id ? this.db.couponSales.find((item) => Number(item.id) === Number(id)) : null;
          const record = {
            atletaId: Number(fd.get("atletaId")),
            dataVenda: this.emptyToNull(fd.get("dataVenda")) || this.today(),
            valorTotal: Number(fd.get("valorTotal") || 0) || 0,
            quantidadePedidos: Number(fd.get("quantidadePedidos") || 0) || 0,
            observacao: String(fd.get("observacao") || "").trim(),
            createdAt: existing ? existing.createdAt : this.nowIso(),
            updatedAt: this.nowIso()
          };

          await this.saveRecord("couponSales", record, existing ? existing.id : null);
          await this.afterEntitySave();
        },

        openAttachmentForm(athleteId, sourceTab) {
          this.setReturnToProfile(athleteId, sourceTab || "anexos");
          this.openModal(
            "Novo anexo",
            `
              <form onsubmit="App.submitAttachment(event, ${Number(athleteId)})">
                <div class="form-grid">
                  ${this.field("Arquivo *", `<input class="input" type="file" name="arquivo" required accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt" />`, true)}
                  ${this.field("Observacao", `<textarea class="textarea" name="observacao" placeholder="Ex.: contrato assinado, comprovante de envio..."></textarea>`, true)}
                </div>
                <div class="meta" style="margin-top: 12px;">Formatos: imagens, PDF, Word, Excel, CSV ou TXT. Tamanho maximo: 6 MB.</div>
                <div class="form-actions">
                  <button class="btn btn-secondary" type="button" onclick="App.cancelModalFlow()">Cancelar</button>
                  <button class="btn btn-primary" type="submit">Enviar anexo</button>
                </div>
              </form>
            `
          );
        },

        async submitAttachment(event, athleteId) {
          event.preventDefault();
          const form = event.target;
          const file = form.querySelector('[name="arquivo"]').files[0];
          if (!file) return;
          if (file.size > MAX_ATTACHMENT_SIZE) {
            alert("O arquivo precisa ter no maximo 6 MB.");
            return;
          }

          const submitButton = form.querySelector('button[type="submit"]');
          submitButton.disabled = true;
          submitButton.textContent = "Enviando...";

          const path = `atletas/${Number(athleteId)}/${Date.now()}-${this.sanitizeFileName(file.name)}`;
          try {
            await this.uploadStorageObject(path, file);
            await this.saveRecord("attachments", {
              atletaId: Number(athleteId),
              nomeArquivo: file.name,
              caminhoArquivo: path,
              urlArquivo: this.storagePublicUrl(path),
              tipoArquivo: file.type || "arquivo",
              tamanhoArquivo: file.size,
              observacao: String(new FormData(form).get("observacao") || "").trim(),
              createdAt: this.nowIso(),
              updatedAt: this.nowIso()
            }, null);
            await this.afterEntitySave();
          } catch (error) {
            await this.deleteStorageObject(path).catch(() => null);
            alert("Nao foi possivel enviar o anexo. Confirme se o SQL dos anexos foi executado no Supabase.");
            console.error(error);
            submitButton.disabled = false;
            submitButton.textContent = "Enviar anexo";
          }
        },

        field(label, inputHtml, full) {
          return `
            <div class="field ${full ? "form-full" : ""}">
              <label>${label}</label>
              ${inputHtml}
            </div>
          `;
        },

        openAthleteProfile(id, tab) {
          const athlete = this.athleteById(id);
          if (!athlete) return;
          this.state.profileTab = tab || "dados";

          const posts = this.db.posts.filter((item) => Number(item.atletaId) === Number(id)).sort((a, b) => String(b.dataPublicacao || "").localeCompare(String(a.dataPublicacao || "")));
          const conversations = this.db.conversations.filter((item) => Number(item.atletaId) === Number(id)).sort((a, b) => String(b.dataConversa || "").localeCompare(String(a.dataConversa || "")));
          const products = this.db.products.filter((item) => Number(item.atletaId) === Number(id)).sort((a, b) => String(b.dataEnvio || "").localeCompare(String(a.dataEnvio || "")));
          const couponSales = this.couponSalesByAthlete(id);
          const tasks = this.db.tasks.filter((item) => Number(item.atletaId) === Number(id)).sort((a, b) => String(a.prazo || "").localeCompare(String(b.prazo || "")));
          const attachments = this.attachmentsByAthlete(id);

          const metrics = `
            <div class="profile-grid">
              ${this.profileMetric("Seguidores", this.formatNumber(athlete.numeroSeguidores))}
              ${this.profileMetric("Posts", posts.length)}
              ${this.profileMetric("Conversas", conversations.length)}
              ${this.profileMetric("Produtos", products.length)}
              ${this.profileMetric("Vendas cupom", this.formatCurrency(this.totalCouponSalesByAthlete(id)))}
              ${this.profileMetric("Custo total", this.formatCurrency(this.totalProductCostByAthlete(id)))}
            </div>
          `;

          const tabs = ["dados", "posts", "conversas", "produtos", "tarefas", "vendas", "anexos"]
            .map((item) => `<button type="button" class="tab ${this.state.profileTab === item ? "active" : ""}" onclick="App.openAthleteProfile(${id}, '${item}')">${item}</button>`)
            .join("");

          let profileActions = "";
          let body = "";

          if (this.state.profileTab === "dados") {
            body = `
              <div class="card panel-body">
                <div class="details-grid">
                  ${this.detailRow("Instagram", athlete.instagram)}
                  ${this.detailRow("TikTok", athlete.tiktok)}
                  ${this.detailRow("Email", athlete.email)}
                  ${this.detailRow("CPF", athlete.cpf)}
                  ${this.detailRow("WhatsApp", athlete.whatsapp)}
                  ${this.detailRow("Cidade", athlete.cidade)}
                  ${this.detailRow("Endereco", athlete.endereco)}
                  ${this.detailRow("Modalidade", athlete.modalidade)}
                  ${this.detailRow("Inicio parceria", this.formatDate(athlete.dataInicioParceria))}
                  ${this.detailRow("Status", this.statusControl("athlete", athlete.id, athlete.status, athlete.id, "dados"))}
                  ${this.detailRow("Link bio", athlete.linkBio)}
                  ${this.detailRow("Linktree", athlete.linktree)}
                  ${this.detailRow("Agencia", athlete.agenciaResponsavel)}
                  ${this.detailRow("Cupom", athlete.cupomAtleta)}
                  ${this.detailRow("Comissao", athlete.comissaoPercentual ? `${athlete.comissaoPercentual}%` : "-")}
                  ${this.detailRow("Total vendido cupom", this.formatCurrency(this.totalCouponSalesByAthlete(id)))}
                  ${this.detailRow("Comissao estimada", this.formatCurrency(this.estimatedCommissionByAthlete(id)))}
                </div>
              </div>
            `;
          }

          if (this.state.profileTab === "posts") {
            profileActions = `
              <div class="actions" style="margin-bottom: 14px;">
                <button class="btn btn-primary" type="button" onclick="App.openPostForm(null, ${id}, 'posts')">Novo post</button>
              </div>
            `;
            body = posts.length ? `
              <div class="card">
                <div class="table-wrap">
                  <table>
                    <thead><tr><th>Plataforma</th><th>Tipo</th><th>Data</th><th>Campanha</th><th>Views</th><th>Likes</th></tr></thead>
                    <tbody>
                      ${posts.map((item) => `
                        <tr>
                          <td>${this.escape(item.plataforma)}</td>
                          <td>${this.escape(item.tipo)}</td>
                          <td>${this.formatDate(item.dataPublicacao)}</td>
                          <td>${this.escape(item.campanhaVinculada || "-")}</td>
                          <td>${this.formatNumber(item.views)}</td>
                          <td>${this.formatNumber(item.likes)}</td>
                        </tr>
                      `).join("")}
                    </tbody>
                  </table>
                </div>
              </div>
            ` : `<div class="card empty">Nenhum post cadastrado.</div>`;
          }

          if (this.state.profileTab === "conversas") {
            profileActions = `
              <div class="actions" style="margin-bottom: 14px;">
                <button class="btn btn-primary" type="button" onclick="App.openConversationForm(null, ${id}, 'conversas')">Nova conversa</button>
              </div>
            `;
            body = conversations.length ? `
              <div class="list">
                ${conversations.map((item) => `
                  <div class="card" style="padding:16px;">
                    <strong>${this.escape(item.canal)}</strong>
                    <div class="meta">${this.formatDate(item.dataConversa)}</div>
                    <div style="margin-top:8px;">${this.escape(item.resumoConversa)}</div>
                    <div class="meta" style="margin-top:8px;">Proximo passo: ${this.escape(item.proximoPasso || "-")}</div>
                  </div>
                `).join("")}
              </div>
            ` : `<div class="card empty">Nenhuma conversa registrada.</div>`;
          }

          if (this.state.profileTab === "produtos") {
            profileActions = `
              <div class="actions" style="margin-bottom: 14px;">
                <button class="btn btn-primary" type="button" onclick="App.openProductForm(null, ${id}, 'produtos')">Novo envio</button>
              </div>
            `;
            body = products.length ? `
              <div class="card">
                <div class="table-wrap">
                  <table>
                    <thead><tr><th>Produto</th><th>Tamanho</th><th>Qtd</th><th>Custo</th><th>Status</th><th>Envio</th></tr></thead>
                    <tbody>
                      ${products.map((item) => `
                        <tr>
                          <td>${this.escape(item.produto)}</td>
                          <td>${this.escape(item.tamanho || "-")}</td>
                          <td>${this.escape(item.quantidade)}</td>
                          <td>${this.formatCurrency(item.custoTotal)}</td>
                          <td>${this.statusControl("product", item.id, item.status, id, "produtos")}</td>
                          <td>${this.formatDate(item.dataEnvio)}</td>
                        </tr>
                      `).join("")}
                    </tbody>
                  </table>
                </div>
              </div>
            ` : `<div class="card empty">Nenhum produto enviado.</div>`;
          }

          if (this.state.profileTab === "tarefas") {
            profileActions = `
              <div class="actions" style="margin-bottom: 14px;">
                <button class="btn btn-primary" type="button" onclick="App.openTaskForm(null, ${id}, 'tarefas')">Nova tarefa</button>
              </div>
            `;
            body = tasks.length ? `
              <div class="list">
                ${tasks.map((item) => `
                  <div class="task-card ${this.computedTaskStatus(item) === "atrasado" ? "overdue" : ""}">
                    <div style="flex:1;">
                      <strong>${this.escape(item.tarefa)}</strong>
                      <div class="meta">Prazo ${this.formatDate(item.prazo)}${item.campanha ? ` • ${this.escape(item.campanha)}` : ""}</div>
                    </div>
                    ${this.statusControl("task", item.id, this.computedTaskStatus(item), id, "tarefas")}
                  </div>
                `).join("")}
              </div>
            ` : `<div class="card empty">Nenhuma tarefa cadastrada.</div>`;
          }

          if (this.state.profileTab === "vendas") {
            profileActions = `
              <div class="actions" style="margin-bottom: 14px;">
                <button class="btn btn-primary" type="button" onclick="App.openCouponSaleForm(null, ${id}, 'vendas')">Nova venda</button>
              </div>
              <div class="summary-chips">
                <div class="chip">
                  <strong>Total vendido</strong>
                  <span class="muted">${this.formatCurrency(this.totalCouponSalesByAthlete(id))}</span>
                </div>
                <div class="chip">
                  <strong>Pedidos</strong>
                  <span class="muted">${this.totalCouponOrdersByAthlete(id)}</span>
                </div>
                <div class="chip">
                  <strong>Comissao estimada</strong>
                  <span class="muted">${this.formatCurrency(this.estimatedCommissionByAthlete(id))}</span>
                </div>
                <div class="chip">
                  <strong>Cupom</strong>
                  <span class="muted">${this.escape(athlete.cupomAtleta || "-")}</span>
                </div>
              </div>
            `;
            body = couponSales.length ? `
              <div class="card">
                <div class="table-wrap">
                  <table>
                    <thead><tr><th>Data</th><th>Valor total</th><th>Pedidos</th><th>Observacao</th><th>Acoes</th></tr></thead>
                    <tbody>
                      ${couponSales.map((item) => `
                        <tr>
                          <td>${this.formatDate(item.dataVenda)}</td>
                          <td>${this.formatCurrency(item.valorTotal)}</td>
                          <td>${this.escape(item.quantidadePedidos)}</td>
                          <td>${this.escape(item.observacao || "-")}</td>
                          <td>
                            <div class="actions">
                              <button class="action-link" type="button" onclick="App.openCouponSaleForm(${item.id}, ${id}, 'vendas')">Editar</button>
                              <button class="action-link danger" type="button" onclick="App.deleteEntity('couponSales', ${item.id}, ${id}, 'vendas')">Excluir</button>
                            </div>
                          </td>
                        </tr>
                      `).join("")}
                    </tbody>
                  </table>
                </div>
              </div>
            ` : `<div class="card empty">Nenhuma venda por cupom cadastrada.</div>`;
          }

          if (this.state.profileTab === "anexos") {
            profileActions = `
              <div class="actions" style="margin-bottom: 14px;">
                <button class="btn btn-primary" type="button" onclick="App.openAttachmentForm(${id}, 'anexos')">Novo anexo</button>
              </div>
            `;
            body = attachments.length ? `
              <div class="card">
                <div class="table-wrap">
                  <table>
                    <thead><tr><th>Arquivo</th><th>Tipo</th><th>Tamanho</th><th>Observacao</th><th>Enviado em</th><th>Acoes</th></tr></thead>
                    <tbody>
                      ${attachments.map((item) => `
                        <tr>
                          <td><strong>${this.escape(item.nomeArquivo)}</strong></td>
                          <td>${this.escape(item.tipoArquivo || "-")}</td>
                          <td>${this.formatFileSize(item.tamanhoArquivo)}</td>
                          <td>${this.escape(item.observacao || "-")}</td>
                          <td>${this.formatDate(item.createdAt)}</td>
                          <td>
                            <div class="actions">
                              <a class="action-link" href="${this.escape(item.urlArquivo || this.storagePublicUrl(item.caminhoArquivo))}" target="_blank" rel="noopener">Abrir</a>
                              <button class="action-link danger" type="button" onclick="App.deleteAttachment(${item.id}, ${id})">Excluir</button>
                            </div>
                          </td>
                        </tr>
                      `).join("")}
                    </tbody>
                  </table>
                </div>
              </div>
            ` : `<div class="card empty">Nenhum anexo cadastrado para este atleta.</div>`;
          }

          this.openModal(
            `Perfil de ${this.escape(athlete.nome)}`,
            `
              ${metrics}
              <div class="tabs">${tabs}</div>
              ${profileActions}
              ${body}
            `
          );
        },

        profileMetric(label, value) {
          return `
            <div class="card profile-metric">
              <div style="font-size:24px; font-weight:700;">${this.escape(value)}</div>
              <div class="meta" style="margin-top:6px;">${label}</div>
            </div>
          `;
        },

        detailRow(label, value) {
          return `
            <div class="label">${label}</div>
            <div>${value || "-"}</div>
          `;
        }
      };

      window.App = App;
      App.init();
    </script>
  </body>
</html>
